<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - SMA Electronics</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <a href="../index.html" class="logo">
                SMA Electronics
            </a>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#categories">Categories</a></li>
                <li><a href="../index.html#products">Products</a></li>
                <li><a href="../index.html#about">About</a></li>
                <li><a href="../index.html#contact">Contact</a></li>
            </ul>

        </nav>
    </header>


    <!-- Product Details -->

    <main>

        <section class="product-details" id="productDetails">

            <p class="loading-message">Loading product...</p>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 SMA Electronics &amp; Home Appliances. All rights reserved.
        </p>

    </footer>

    <script>

        const API_BASE_URL = "https://electronics-shop-website-fullstack-1.onrender.com/api/products";
        const detailsSection = document.getElementById("productDetails");

        function getProductId() {
            const params = new URLSearchParams(window.location.search);
            return params.get("id");
        }

        function renderProduct(product) {

            detailsSection.innerHTML = `
                <div class="product-details-image">
                    <img src="${product.imageUrl}" alt="${product.name}">
                </div>

                <div class="product-details-content">

                    <p class="product-category">${product.category}</p>

                    <h1>${product.name}</h1>

                    <p class="product-description">${product.description}</p>

                    <p class="product-info">Price: &#8377;${product.price}</p>

                    <a href="https://wa.me/918124477901" class="btn" target="_blank" rel="noopener">
                        Contact / WhatsApp
                    </a>

                </div>
            `;

        }

        async function loadProduct() {

            const id = getProductId();

            if (!id) {
                detailsSection.innerHTML = `<p class="loading-message">No product selected.</p>`;
                return;
            }

            try {

                const response = await fetch(`${API_BASE_URL}/${id}`);

                if (!response.ok) {
                    throw new Error("Server responded with " + response.status);
                }

                const product = await response.json();
                renderProduct(product);

            } catch (error) {

                console.error("Failed to load product:", error);

                detailsSection.innerHTML = `
                    <p class="loading-message">
                        Couldn't load this product. Make sure the backend
                        server is running at ${API_BASE_URL}.
                    </p>
                `;

            }

        }

        loadProduct();

    </script>

</body>

</html>
