<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - SMA Electronics</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./admin.css">
</head>

<body>

    <main class="login-page">

        <form id="loginForm" class="admin-form login-form">

            <h2>Admin Login</h2>

            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">

            <div class="form-actions">
                <button type="submit" class="btn">Log In</button>
            </div>

            <p id="loginMessage" class="form-message"></p>

        </form>

    </main>

    <script src="./admin-login.js"></script>

</body>
</html>
