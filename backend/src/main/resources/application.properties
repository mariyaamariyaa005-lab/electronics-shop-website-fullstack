# Server
# Render (and most hosting platforms) assign their own port via the PORT
# environment variable. This falls back to 8080 for local development.
server.port=${PORT:8080}

# --- Database ---
# Defaults to local H2 (in-memory) for development on your own laptop.
# On Render, these are overridden by environment variables pointing at a
# real, persistent PostgreSQL database, so your data survives restarts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smadb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true

# "update" keeps existing data and only adjusts the schema if needed —
# unlike "create-drop", it will NOT wipe your data on restart.
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

