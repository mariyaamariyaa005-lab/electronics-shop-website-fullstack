# Server
server.port=8080

# H2 in-memory database (no install needed — resets each time you restart the app)
spring.datasource.url=jdbc:h2:mem:smadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# View your data in the browser at http://localhost:8080/h2-console
# JDBC URL to use on that login screen: jdbc:h2:mem:smadb
spring.h2.console.enabled=true

# Recreate schema on every restart, then load data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Switching to MySQL later ---
# Comment out the H2 block above and uncomment this, then add the
# mysql-connector-j dependency to pom.xml:
